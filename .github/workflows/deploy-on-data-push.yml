name: 数据推送后发布网站

# 本地拉取脚本(scripts/fetch_margin_local.py)把两融数据推到 main 后,
# 立即把 docs/ 重新发布到 gh-pages,不必等第二天的定时日报任务。
# daily.yml 的机器人提交也会触发本 workflow,多发布一次是幂等的,无害。

on:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 从 gh-pages 取回逐股两融明细
        run: |
          # docs/margin/detail/ 体积大(约43MB)且每日全量重写,被 .gitignore 排除、
          # 只由 scripts/build_margin_db.py 直接推到 gh-pages。下面的 force_orphan
          # 会用 main 的 docs/ 整树替换 gh-pages,不先取回来就会把它抹掉。
          git fetch origin gh-pages --depth=1 || exit 0
          git --work-tree=./docs checkout FETCH_HEAD -- margin/detail 2>/dev/null || \
            echo "gh-pages 上还没有 margin/detail(首次发布),跳过。"
          git reset -q
      - name: 发布看板到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          commit_message: "发布看板"
